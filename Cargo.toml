[package]
name = "rwc"
version = "0.1.0"
edition = "2021"
authors = ["Mugisha Jean Claude"]
description = "A parallel word count CLI in Rust, in the shape of wc"
license = "MIT"
repository = "https://github.com/mugishajc/rust-wordcount-cli"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"

[[bin]]
name = "rwc"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
